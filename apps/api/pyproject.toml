[project]
name = "forge-api"
version = "0.1.0"
description = "FORGE API — FastAPI backend for the beta app and the Bridge (PRD §4.9, Appendix I)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "aiosqlite>=0.20",
    "google-cloud-storage>=2.18",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_api"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"

[[tool.mypy.overrides]]
# pyarrow is an optional extra (processed-property parquet); storage.py falls back to JSONL.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Repo-level acceptance tests (tests/acceptance/issue-<N>/) MUST run as part of
# `cd apps/api && uv run pytest` — that is what the root Makefile `test` target
# and the Gauntlet execute (PRD Appendix D.1).
testpaths = ["tests", "../../tests/acceptance"]
addopts = "-q"
